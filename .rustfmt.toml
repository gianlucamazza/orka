# rustfmt configuration for the orka workspace
#
# Unstable options below require nightly rustfmt. CI, just fmt, and
# pre-commit pin rustfmt via RUSTFMT_TOOLCHAIN (default nightly-2026-10-15,
# last green main before floating nightly wrap_comments started wrapping
# decorative banners).

# Use Field init shorthand if possible
use_field_init_shorthand = true

# Use try! instead of try! macros
use_try_shorthand = true

# Format code in doc comments
format_code_in_doc_comments = true

# Group imports by module and crate to ensure consistency
imports_granularity = "Crate"
group_imports = "StdExternalCrate"

# Max line width
max_width = 100

# Wrap comments
wrap_comments = true
