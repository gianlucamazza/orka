# Configuration for cargo-audit (CI: "Security audit" step in ci.yml).
# Keep the ignore list in sync with deny.toml ([advisories].ignore).

[advisories]
ignore = [
  # tokio-tar: dev-only dependency via testcontainers; not present in
  # production binaries. No fixed version available upstream.
  "RUSTSEC-2025-0111",
  # lopdf < 0.42 via printpdf 0.7 (held at 0.7; 0.12 rewrites the PDF API).
  # pdf-extract is now 0.12 / lopdf 0.42.
  "RUSTSEC-2026-0187",
  # quick-xml < 0.41 via syntect -> plist; fixed only in quick-xml 0.41,
  # which needs upstream bumps.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # zstd 0.13 via wasmtime-internal-cache (49.x and 50.x both require
  # zstd ^0.13). Fixed only in zstd 0.14 / zstd-safe 8 / zstd-sys 2.1.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0410",
]
