name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  commits:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.14.0
        ports:
          - 6333:6333
          - 6334:6334
        # The qdrant image ships neither curl nor wget; probe the TCP port
        # with bash instead.
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/localhost/6333' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update || echo "apt-get update had failures, continuing anyway"
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # .rustfmt.toml uses unstable options (imports_granularity,
      # group_imports, wrap_comments, format_code_in_doc_comments), so
      # rustfmt must be nightly — not stable. Pin a dated nightly: floating
      # nightly rustfmt changed wrap_comments after 2026-10-15 and started
      # wrapping decorative section banners. Do not float this pin.
      - uses: dtolnay/rust-toolchain@nightly-2026-10-15
        with:
          components: rustfmt
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Check formatting
        run: cargo +nightly-2026-10-15 fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets
      - name: Security audit
        # .cargo/audit.toml is the cargo-audit config path (tokio-tar and
        # unrelated crate ignores). wasmtime 42.x IDs were dropped with the
        # 49.0.2 bump; do not re-add CLI --ignore flags for patched crates.
        run: cargo audit
      - name: Dependency checks (licenses, advisories, bans)
        run: cargo deny check
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Integration tests (Redis + Qdrant)
        run: cargo test --workspace -- --ignored
        env:
          REDIS_URL: redis://127.0.0.1:6379
          QDRANT_URL: http://localhost:6334

  wasm:
    name: WASM build (wasm32-wasip1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM SDK (raw ABI)
        run: cargo build -p orka-plugin-sdk --target wasm32-wasip1
      - name: Build WASM SDK (Component Model)
        run: cargo build -p orka-plugin-sdk-component --target wasm32-wasip1
      - name: Build example WASM plugin
        run: cargo build -p hello-plugin --target wasm32-wasip1

  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update || echo "apt-get update had failures, continuing anyway"
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      # Pin 1.96.0 explicitly (do not use the repo default/stable toolchain).
      # dtolnay/rust-toolchain@1.96.0 installs that version as the directory
      # override; `cargo +1.96.0` then cannot pick nightly/stable by accident.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: |
          rustc +1.96.0 --version
          RUSTC_WRAPPER= cargo +1.96.0 check --workspace

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.14.0
        ports:
          - 6333:6333
          - 6334:6334
        # The qdrant image ships neither curl nor wget; probe the TCP port
        # with bash instead.
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/localhost/6333' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update || echo "apt-get update had failures, continuing anyway"
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --codecov --output-path codecov.json -- --include-ignored
        env:
          REDIS_URL: redis://127.0.0.1:6379
          QDRANT_URL: http://localhost:6334
