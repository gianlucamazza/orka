name: Packaging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  debian:
    name: Packaging lint (Debian)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and lint Debian package
        run: ./scripts/lint-debian-package.sh

  fedora:
    name: Packaging lint (Fedora)
    runs-on: ubuntu-latest
    env:
      # Free unused runner toolchains/images before the Fedora container
      # build. Override locally with FEDORA_LINT_FREE_DISK=0, or set
      # FEDORA_LINT_PRUNE_PATHS to a space-separated path list.
      FEDORA_LINT_FREE_DISK: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build and lint Fedora package
        run: ./scripts/lint-fedora-package.sh
