version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Security updates are not grouped by default, so a single crate from a
      # tightly coupled stack can be bumped alone and break the build
      # (e.g. opentelemetry_sdk without opentelemetry/opentelemetry-otlp).
      opentelemetry-security:
        applies-to: security-updates
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      wasmtime-security:
        applies-to: security-updates
        patterns:
          - "wasmtime*"
          - "wasi-common"
      rust-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    ignore:
      # dtolnay/rust-toolchain tags are Rust toolchain versions, not action
      # releases: "bumping" them silently changes the toolchain under test
      # (e.g. the MSRV job). Update manually together with rust-version.
      - dependency-name: "dtolnay/rust-toolchain"
